<div class="login-page">
  <div class="login-card fade-up">

    <!-- ═══════ LEFT: LOGIN FORM ═══════ -->
    <div class="lc-form">
      <div class="lc-brand">
        <span class="lc-brand-name">HNPCL <b>EMS</b></span>
        <span class="lc-brand-sub">Hinduja National Power Corporation Ltd.</span>
      </div>

  

      <form class="si-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <!-- Username -->
        <div class="si-field">
          <label for="username">Username</label>
          <div class="si-input-wrap">
            <svg class="si-lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              id="username"
              type="text"
              placeholder="Enter your username"
              [(ngModel)]="username"
              name="username"
              autocomplete="username"
              (focus)="clearError()" />
          </div>
        </div>

        <!-- Password -->
        <div class="si-field">
          <label for="password">Password</label>
          <div class="si-input-wrap">
            <svg class="si-lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              (focus)="clearError()" />
            <button type="button" class="si-eye" (click)="togglePassword()" tabindex="-1"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Row: remember / forgot -->
        <div class="si-row">
          <label class="si-remember">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span class="si-check"></span>
            Remember me
          </label>
          <a class="si-forgot" href="javascript:void(0)">Forgot password?</a>
        </div>

        <!-- Error -->
        <div class="si-error" *ngIf="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMessage }}
        </div>

        <!-- Submit -->
        <button type="submit" class="si-submit" [disabled]="isLoading" [class.loading]="isLoading">
          <span class="si-spinner" *ngIf="isLoading"></span>
          <svg *ngIf="!isLoading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          {{ isLoading ? 'Signing in...' : 'Sign In to EMS' }}
        </button>

        <div class="si-divider"><span>Secured system</span></div>

        <p class="si-note">
          Access is restricted to authorised HNPCL personnel.
          Contact the system administrator for credentials.
        </p>
      </form>

      <p class="si-footer">© {{ year }} HNPCL &middot; Contract Employees Management System &middot; v2.0</p>
    </div>

    <!-- ═══════ RIGHT: FULL PLANT IMAGE + OVERLAY CAPTION ═══════ -->
    <div class="lc-visual">
      <div class="lc-image">
        <img src="hnpcl-plant.png" alt="Vizag Thermal Power Plant, HNPCL" />
      </div>

      <!-- <div class="lc-caption">
        <span class="bp-eyebrow">Contract Employees Management System</span>
        <h3 class="lc-caption-title">Powering secure workforce management</h3>
        <p class="lc-caption-desc">
          Registrations, gate passes, wages and statutory reports —
          managed end-to-end from a single console.
        </p>

        <div class="lc-status">
          <span class="bp-plant-dot"></span> Vizag Thermal Power Plant &middot; 2 × 520 MW
        </div>
      </div> -->
    </div>

  </div>
</div>
