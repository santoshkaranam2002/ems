<div class="fade-up">
  <div class="page-head">
    <div class="ph-titles">
      <span class="ph-eyebrow">Reports</span>
      <h2 class="ph-title">Employee Salary Not Issued Report</h2>
      <p class="ph-desc">Set the filters and generate the report, then export it as PDF or Excel</p>
    </div>
    <div class="ph-actions">
      <button class="btn btn-outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print
      </button>
      <button class="btn btn-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Excel
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card rv-filters">
    <div class="rvf-grid">
      <div class="field">
        <label>Contractor</label>
        <div class="select-wrap"><select class="select"><option *ngFor="let c of contractors">{{ c }}</option></select></div>
      </div>
      <div class="field">
        <label>Location</label>
        <div class="select-wrap"><select class="select"><option *ngFor="let l of locations">{{ l }}</option></select></div>
      </div>
      <div class="field">
        <label>From Date</label>
        <input class="input" type="date" />
      </div>
      <div class="field">
        <label>To Date</label>
        <input class="input" type="date" />
      </div>
      <div class="field rvf-btn">
        <label>&nbsp;</label>
        <button class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Generate Report
        </button>
      </div>
    </div>
  </div>

  <!-- Result placeholder -->
  <div class="card">
    <div class="empty-state">
      <div class="es-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div class="es-title">Employee Salary Not Issued Report</div>
      <p class="es-desc">Choose the filters above and click <b>Generate Report</b> to preview the report here.</p>
    </div>
  </div>
</div>
